<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter for Mutia</title>
    <style>
        body {
            background-color: #ffe4e1;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 200vh; /* Tambahkan tinggi minimum untuk memastikan halaman dapat digulir */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background: #ffcccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            margin-top: 50px;
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffc0cb;
            clip-path: polygon(100% 100%, 50% 0%, 0% 100%);
            transition: transform 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .envelope.open .flap {
            transform: translateY(-100%);
        }

        .letter {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 260px;
            height: 350px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: transform 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 1.5s ease-in-out;
        }

        .envelope.open .letter {
            transform: translateX(-50%) translateY(-50%);
            opacity: 1;
        }

        .heart {
            color: #ff6f61;
            font-size: 2rem;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .controls button {
            padding: 10px;
            border: none;
            border-radius: 50%;
            background-color: #ff6f61;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
        }

        .controls button:hover {
            background-color: #ff4a3b;
        }

        .volume-slider {
            width: 100px;
        }

        @media (max-width: 480px) {
            .envelope {
                height: 150px;
            }

            .controls button {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }

            .volume-slider {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="envelope" onclick="openEnvelope()">
        <div class="flap"></div>
        <div class="letter">
            <h2>Dear Muti,</h2>
            <p>Write your sweet message here...</p>
            <span class="heart">&#10084;</span>
        </div>
    </div>

    <div class="controls">
        <button id="playPauseButton" onclick="togglePlayPause()">&#9658;</button>
        <input type="range" class="volume-slider" min="0" max="1" step="0.1" onchange="setVolume(this.value)">
    </div>

    <audio id="music" src="bgmusic.mp3.mp3" loop></audio>
    <audio id="effect" src="click-effect.mp3"></audio>

    <script>
        const envelope = document.querySelector('.envelope');
        const music = document.getElementById('music');
        const effect = document.getElementById('effect');
        const playPauseButton = document.getElementById('playPauseButton');

        // Set initial volume to 25%
        music.volume = 0.25;

        function openEnvelope() {
            envelope.classList.add('open');
            effect.play();
            music.currentTime = 180; // Start music at 3:00 (180 seconds)
            music.play();
            updatePlayPauseIcon();
        }

        function togglePlayPause() {
            if (music.paused) {
                music.play();
            } else {
                music.pause();
            }
            updatePlayPauseIcon();
        }

        function updatePlayPauseIcon() {
            if (music.paused) {
                playPauseButton.innerHTML = '&#9658;'; // Play icon
            } else {
                playPauseButton.innerHTML = '&#10074;&#10074;'; // Pause icon
            }
        }

        function setVolume(value) {
            music.volume = value;
        }
    </script>
</body>
</html>
